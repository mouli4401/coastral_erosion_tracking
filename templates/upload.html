<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coastal Erosion Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Coastal Erosion Tracker</h1>
        <p>Upload an image or CSV file to analyze coastal erosion impact.</p>

        <form action="/" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv, .jpg, .png, .jpeg" required>
            <button type="submit">Upload</button>
        </form>
    </div>
</body>
</html>
